<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warrior Fantasy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 40%, #46106b %, #160b2d 35%, #05030c 75%);
    }

    .scene {
      position: relative;
      width: 900px;
      height: 650px;
    }

    /* Ánh sáng phía sau */
    .glow {
      position: absolute;
      width: 430px;
      height: 430px;
      left: 235px;
      top: 80px;
      border-radius: 50%;
      background: #b000ff;
      filter: blur(100px);
      opacity: .35;
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(.9); opacity: .25; }
      to   { transform: scale(1.1); opacity: .45; }
    }

    svg {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    /* Hào quang quanh vũ khí */
    .energy {
      fill: none;
      stroke: #ff164f;
      stroke-width: 7;
      filter: drop-shadow(0 0 10px #ff164f)
              drop-shadow(0 0 25px #a000ff);
    }

    .energy2 {
      fill: none;
      stroke: #7d3cff;
      stroke-width: 4;
      filter: drop-shadow(0 0 12px #7d3cff);
    }

    /* Áo choàng */
    .cape {
      fill: #170d25;
      stroke: #7625b8;
      stroke-width: 5;
      filter: drop-shadow(0 0 12px #721cff);
    }

    /* Giáp */
    .armor {
      fill: url(#armorGradient);
      stroke: #e83cff;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px #a800ff);
    }

    .armorDark {
      fill: #171421;
      stroke: #8e36d8;
      stroke-width: 3;
    }

    /* Mắt */
    .eye {
      fill: #ff174f;
      filter: drop-shadow(0 0 8px red);
    }

    /* Lưỡi đao */
    .blade {
      fill: url(#bladeGradient);
      stroke: #ff4d75;
      stroke-width: 3;
      filter:
        drop-shadow(0 0 7px #ff174f)
        drop-shadow(0 0 18px #8f00ff);
    }

    .handle {
      fill: #21172b;
      stroke: #ffb000;
      stroke-width: 4;
    }

    /* Tia năng lượng */
    .spark {
      fill: #ff35d4;
      filter: drop-shadow(0 0 8px #ff35d4);
    }

    .title {
      position: absolute;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: white;
      font-size: 28px;
      letter-spacing: 8px;
      text-shadow:
        0 0 8px #ff164f,
        0 0 20px #8e00ff;
    }

    .subtitle {
      position: absolute;
      bottom: -15px;
      width: 100%;
      text-align: center;
      color: #d9aaff;
      font-size: 12px;
      letter-spacing: 4px;
    }
  </style>
</head>

<body>

<div class="scene">

  <div class="glow"></div>

  <svg viewBox="0 0 900 650">

    <defs>

      <!-- Giáp -->
      <linearGradient id="armorGradient"
                      x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#32104f"/>
        <stop offset="45%" stop-color="#101018"/>
        <stop offset="70%" stop-color="#b01968"/>
        <stop offset="100%" stop-color="#35105c"/>
      </linearGradient>

      <!-- Đao -->
      <linearGradient id="bladeGradient"
                      x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="25%" stop-color="#ff80a0"/>
        <stop offset="55%" stop-color="#9d27ff"/>
        <stop offset="100%" stop-color="#26004d"/>
      </linearGradient>

      <!-- Nền -->
      <radialGradient id="circleGradient">
        <stop offset="0%" stop-color="#ff2388" stop-opacity=".4"/>
        <stop offset="70%" stop-color="#6d00ff" stop-opacity=".12"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

    </defs>

    <!-- Vòng năng lượng -->
    <circle cx="450" cy="320" r="250"
            fill="url(#circleGradient)"/>

    <circle cx="450" cy="320" r="220"
            class="energy2"
            stroke-dasharray="20 25"/>

    <circle cx="450" cy="320" r="245"
            class="energy"
            stroke-dasharray="4 35"
            opacity=".7"/>

    <!-- Áo choàng phía sau -->
    <path class="cape"
          d="M330 205
             Q450 165 570 205
             L640 540
             Q530 480 450 560
             Q370 480 260 540
             Z"/>

    <!-- Đao bên trái -->
    <g transform="rotate(-28 320 280)">

      <path class="blade"
            d="M260 300
               L120 65
               Q115 45 130 55
               L310 270
               Z"/>

      <rect class="handle"
            x="280" y="260"
            width="35"
            height="110"
            rx="8"/>

      <circle cx="297" cy="375"
              r="15"
              fill="#ff1768"
              filter="drop-shadow(0 0 10px red)"/>

    </g>

    <!-- Đao bên phải -->
    <g transform="rotate(28 580 280)">

      <path class="blade"
            d="M640 300
               L780 65
               Q785 45 770 55
               L590 270
               Z"/>

      <rect class="handle"
            x="585" y="260"
            width="35"
            height="110"
            rx="8"/>

      <circle cx="602" cy="375"
              r="15"
              fill="#ff1768"
              filter="drop-shadow(0 0 10px red)"/>

    </g>

    <!-- Thân -->
    <path class="armor"
          d="M360 330
             Q450 290 540 330
             L570 490
             Q450 540 330 490
             Z"/>

    <!-- Ngực -->
    <path class="armorDark"
          d="M365 340
             L450 315
             L535 340
             L510 420
             L450 445
             L390 420
             Z"/>

    <!-- Lõi năng lượng -->
    <circle cx="450" cy="380"
            r="22"
            fill="#ff174f"
            filter="drop-shadow(0 0 10px #ff174f)
                    drop-shadow(0 0 25px #8b00ff)"/>

    <circle cx="450" cy="380"
            r="9"
            fill="#fff"/>

    <!-- Vai trái -->
    <path class="armor"
          d="M350 335
             Q310 320 285 355
             L325 405
             L385 380
             Z"/>

    <!-- Vai phải -->
    <path class="armor"
          d="M550 335
             Q590 320 615 355
             L575 405
             L515 380
             Z"/>

    <!-- Đầu -->
    <path class="armorDark"
          d="M385 175
             Q450 130 515 175
             L500 285
             Q450 320 400 285
             Z"/>

    <!-- Mặt nạ -->
    <path fill="#24152e"
          stroke="#bd39ff"
          stroke-width="4"
          d="M398 210
             Q450 180 502 210
             L490 265
             Q450 285 410 265
             Z"/>

    <!-- Mắt -->
    <path class="eye"
          d="M410 225 L438 218 L432 233 L408 237 Z"/>

    <path class="eye"
          d="M462 218 L490 225 L492 237 L468 233 Z"/>

    <!-- Sừng / tóc -->
    <path fill="#6814a3"
          stroke="#d52fff"
          stroke-width="3"
          d="M400 190
             L355 135
             L425 165
             L450 120
             L475 165
             L545 135
             L500 190
             Z"/>

    <!-- Chân trái -->
    <path class="armor"
          d="M365 470
             L430 475
             L410 590
             L345 590
             Z"/>

    <!-- Chân phải -->
    <path class="armor"
          d="M470 475
             L535 470
             L555 590
             L490 590
             Z"/>

    <!-- Giày -->
    <path class="armorDark"
          d="M345 570 L410 570 L430 615 L325 615 Z"/>

    <path class="armorDark"
          d="M490 570 L555 570 L575 615 L470 615 Z"/>

    <!-- Tia năng lượng -->
    <circle class="spark" cx="190" cy="160" r="5"/>
    <circle class="spark" cx="710" cy="190" r="6"/>
    <circle class="spark" cx="210" cy="470" r="4"/>
    <circle class="spark" cx="690" cy="450" r="5"/>
    <circle class="spark" cx="280" cy="100" r="3"/>
    <circle class="spark" cx="620" cy="100" r="4"/>

    <!-- Các đường chém -->
    <path d="M90 400 Q220 250 300 220"
          stroke="#ff165d"
          stroke-width="5"
          fill="none"
          opacity=".7"/>

    <path d="M810 400 Q680 250 600 220"
          stroke="#8c2cff"
          stroke-width="5"
          fill="none"
          opacity=".7"/>

  </svg>

  <div class="title">SHADOW WARRIOR</div>
  <div class="subtitle">DARK • SPEED • POWER</div>

</div>


</body>
</html>
